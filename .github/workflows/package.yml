name: package

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  deb:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install the build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y $(cmake -P cmake/build_dependencies.cmake)

      - name: Build the package
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j "$(nproc)"
          (cd build && cpack)

      - name: Check the version against the tag
        run: test "v$(build/src/stack-sampler --version | cut -d' ' -f2)" = "$GITHUB_REF_NAME"

      - uses: actions/upload-artifact@v7
        with:
          name: stack-sampler-${{ github.ref_name }}
          path: build/*.deb
          if-no-files-found: error
